<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Socket.IO chat with connect toggle</title>
  <style>
    body {
      margin: 0;
      padding-bottom: 3rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #form {
      background: rgba(0, 0, 0, 0.15);
      padding: 0.25rem;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      height: 3rem;
      box-sizing: border-box;
      backdrop-filter: blur(10px);
      gap: 0.25rem;
      align-items: center;
    }

    #input {
      border: none;
      padding: 0 1rem;
      flex-grow: 1;
      border-radius: 2rem;
      margin: 0.25rem;
      height: 2rem;
      font-size: 1rem;
    }

    #input:focus {
      outline: none;
    }

    #form > button {
      background: #333;
      border: none;
      padding: 0 1rem;
      margin: 0.25rem;
      border-radius: 3px;
      outline: none;
      color: #fff;
      height: 2.2rem;
      font-size: 0.9rem;
      cursor: pointer;
    }

    #toggle-btn {
      background: #555;
      min-width: 6rem;
    }

    #toggle-btn:hover {
      background: #222;
    }

    #messages {
      list-style-type: none;
      margin: 0;
      padding: 0;
    }

    #messages > li {
      padding: 0.5rem 1rem;
    }

    #messages > li:nth-child(odd) {
      background: #efefef;
    }

    /* small adjustment for better alignment */
    #form button:not(#toggle-btn) {
      background: #2a2a2a;
    }
  </style>
</head>
<body>
  <ul id="messages"></ul>

  <form id="form" action="">
    <input id="input" autocomplete="off" placeholder="Type a message..." />
    <button type="submit">Send</button>
    <button id="toggle-btn" type="button">Disconnect</button>
  </form>

  <!-- Socket.IO client library -->
  <script src="/socket.io/socket.io.js"></script>

  <script>
    // ---- initialize socket connection ----
    const socket = io();

    // ---- DOM elements ----
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');
    const toggleButton = document.getElementById('toggle-btn');

    // ---- chat message sending ----
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (input.value && socket.connected) {
        socket.emit('chat message', input.value);
        input.value = '';
      } else if (!socket.connected) {
        // optional feedback if disconnected
        alert('You are disconnected. Click "Connect" to rejoin the chat.');
      }
    });

    // ---- receiving messages ----
    socket.on('chat message', (msg) => {
      const item = document.createElement('li');
      item.textContent = msg;
      messages.appendChild(item);
      window.scrollTo(0, document.body.scrollHeight);
    });

    // ---- connect / disconnect toggle ----
    toggleButton.addEventListener('click', (e) => {
      e.preventDefault();   // prevent any form submission or default

      if (socket.connected) {
        toggleButton.innerText = 'Connect';
        socket.disconnect();
      } else {
        toggleButton.innerText = 'Disconnect';
        socket.connect();
      }
    });

    // ---- optional: update button text on socket events (robustness) ----
    socket.on('connect', () => {
      toggleButton.innerText = 'Disconnect';
    });

    socket.on('disconnect', () => {
      toggleButton.innerText = 'Connect';
    });
  </script>
</body>
</html>
